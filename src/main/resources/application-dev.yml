spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/agenda_inteligente_dev
    username: postgres
    password: postgres

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Níveis verbosos — só ativos com SPRING_PROFILES_ACTIVE=dev
logging:
  level:
    root: INFO
    br.com.agendainteligente: DEBUG
    br.com.agendainteligente.integration: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.cache: DEBUG
    org.springframework.web.client: DEBUG
