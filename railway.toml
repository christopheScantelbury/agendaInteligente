# Agenda Inteligente — Railway deployment config
# Docs: https://docs.railway.app/reference/config-as-code
#
# Como usar:
#   1. Conecte o repositório GitHub no Railway
#   2. O Railway detecta este arquivo e usa o Dockerfile.backend para o build
#   3. Adicione os add-ons PostgreSQL e Redis no Railway
#   4. Configure as variáveis de ambiente listadas abaixo no painel Railway
#
# Variáveis obrigatórias a configurar no painel:
#   JWT_SECRET          → openssl rand -base64 64
#   CORS_ALLOWED_ORIGINS → https://<seu-app>.vercel.app
#   SPRING_PROFILES_ACTIVE → prod
#
# Variáveis injetadas automaticamente pelo Railway (não precisam de configuração manual):
#   PORT        → porta HTTP que o Railway expõe
#   PGHOST      → host do PostgreSQL add-on
#   PGPORT      → porta do PostgreSQL add-on
#   PGDATABASE  → nome do banco
#   PGUSER      → usuário do banco
#   PGPASSWORD  → senha do banco
#   REDIS_URL   → URL completa do Redis add-on (redis://...)
#
# Variáveis opcionais:
#   GROQ_API_KEY         → IA (Groq LLaMA)
#   NOTAFACIL_API_URL
#   NOTAFACIL_WEBHOOK_BASE_URL

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.backend"

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
