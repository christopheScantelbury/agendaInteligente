name: Deploy (Railway + Vercel)

# IMPORTANTE: o servico Railway do backend DEVE estar configurado como
# Source = Docker Image apontando para ghcr.io/christophescantelbury/agendainteligente-backend:latest
# com credencial PAT do GitHub (read:packages). A mutation serviceInstanceDeploy
# abaixo forca o Railway a pullar a :latest mais recente.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'O que redeployar'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

concurrency:
  group: deploy-railway-vercel
  cancel-in-progress: false

env:
  RAILWAY_PROJECT_ID: 9f219763-3614-4ab3-9ecd-6050bdc74c37
  RAILWAY_ENV_ID: efbcdecf-62c2-4cad-b61a-a17fc2f18008
  RAILWAY_BACKEND_SERVICE_ID: 172a055d-4c11-47c7-b62b-6c02aab1e320
  BACKEND_BASE_URL: https://agendainteligente-production.up.railway.app
  VERCEL_FRONTEND_URL: https://agendainteligente-aleefhenriiques-projects.vercel.app

jobs:
  wait-for-ci:
    name: Aguardar CI passar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Backend (Spring Boot, Java 21)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Publicar imagem backend no GHCR'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Frontend (Vite + TypeScript)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  deploy-backend:
    name: Deploy backend (Railway)
    needs: wait-for-ci
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair marker esperado de application.yml
        id: marker
        run: |
          MARKER=$(grep -oP 'version-marker: \$\{APP_VERSION_MARKER:\K[^}]+' src/main/resources/application.yml || true)
          if [ -z "$MARKER" ]; then
            echo "::warning::Nao foi possivel extrair version-marker; fallback para health-only check."
            echo "marker=" >> $GITHUB_OUTPUT
          else
            echo "Expected version marker: $MARKER"
            echo "marker=$MARKER" >> $GITHUB_OUTPUT
          fi

      - name: Disparar redeploy no Railway (pull GHCR :latest)
        run: |
          set -e
          # serviceInstanceDeploy: forca pull da imagem atual configurada.
          # Como o source no Railway eh image (GHCR :latest), isso puxa a
          # :latest recem publicada pelo job publish-backend-image.
          RESP=$(curl --silent --max-time 30 -w "\n%{http_code}" \
            -X POST "https://backboard.railway.com/graphql/v2" \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceDeploy(environmentId: \\\"${RAILWAY_ENV_ID}\\\", serviceId: \\\"${RAILWAY_BACKEND_SERVICE_ID}\\\") }\"}")
          HTTP=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "HTTP $HTTP — $BODY"
          if [ "$HTTP" != "200" ] || echo "$BODY" | grep -q '"errors"'; then
            echo "::error::Falha ao disparar deploy no Railway"
            exit 1
          fi

      - name: Aguardar Railway subir nova versao (timeout 12min)
        run: |
          EXPECTED="${{ steps.marker.outputs.marker }}"
          HEALTH_URL="${BACKEND_BASE_URL}/actuator/health"
          VERSION_URL="${BACKEND_BASE_URL}/api/publico/version"
          # Railway pull + container restart leva ~30-60s
          sleep 45
          for i in $(seq 1 70); do
            HEALTH=$(curl --silent --max-time 10 -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$HEALTH" != "200" ]; then
              echo "Tentativa ${i}/70 — health=${HEALTH}, aguardando 10s..."
              sleep 10
              continue
            fi
            if [ -n "$EXPECTED" ]; then
              VERSION_RESP=$(curl --silent --max-time 10 "$VERSION_URL" || true)
              VERSION_HTTP=$(curl --silent --max-time 10 -o /dev/null -w "%{http_code}" "$VERSION_URL" || echo "000")
              ACTUAL=$(echo "$VERSION_RESP" | grep -oE '"marker":"[^"]+"' | sed 's/"marker":"\(.*\)"/\1/' || true)
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "Backend rodando versao esperada ($EXPECTED) apos ${i} tentativas."
                exit 0
              fi
              echo "Tentativa ${i}/70 — marker='${ACTUAL}' esperado='${EXPECTED}' (HTTP ${VERSION_HTTP}), aguardando 10s..."
            else
              echo "Backend health OK apos ${i} tentativas (sem marker check)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend nao subiu versao esperada em 12 minutos."
          exit 1

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: wait-for-ci
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build e deploy Vercel
        run: |
          cd frontend
          npx vercel deploy --prod \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --yes 2>&1 | tail -10
        env:
          VERCEL_ORG_ID: team_4hLqFiFQMFA6f4nG2RdmAaqL
          VERCEL_PROJECT_ID: prj_Q2DmmfaWMXVa0FRgV37GIJuHHOWF

      - name: Smoke test frontend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 10 -o /dev/null "${VERCEL_FRONTEND_URL}"; then
              echo "Frontend OK após ${i} tentativas."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Frontend smoke test não confirmou 200 em 5min."
