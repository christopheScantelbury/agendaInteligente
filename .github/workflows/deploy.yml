name: Deploy (Railway + Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'O que redeployar'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

concurrency:
  group: deploy-railway-vercel
  cancel-in-progress: false

env:
  RAILWAY_ENV_ID: 1311cc26-ebee-4989-b49b-0e905b9950cc
  RAILWAY_BACKEND_SERVICE_ID: 177577ac-0796-4351-b1d7-f2e6de397c83
  BACKEND_HEALTH_URL: https://agenda-backend-production-cc5e.up.railway.app/actuator/health
  VERCEL_FRONTEND_URL: https://agenda-inteligente-app.vercel.app

jobs:
  wait-for-ci:
    name: Aguardar CI passar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Backend (Spring Boot, Java 21)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Frontend (Vite + TypeScript)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  deploy-backend:
    name: Deploy backend (Railway)
    needs: wait-for-ci
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'backend')
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy no Railway
        run: |
          RESULT=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceDeploy(environmentId: \\\"${RAILWAY_ENV_ID}\\\", serviceId: \\\"${RAILWAY_BACKEND_SERVICE_ID}\\\") }\"}")
          echo "Railway response: $RESULT"
          echo "$RESULT" | grep -q '"serviceInstanceDeploy":true' || (echo "Deploy falhou!" && exit 1)

      - name: Extrair marker esperado de application.yml
        id: marker
        run: |
          MARKER=$(grep -oP 'version-marker: \$\{APP_VERSION_MARKER:\K[^}]+' src/main/resources/application.yml || true)
          if [ -z "$MARKER" ]; then
            echo "::warning::Nao foi possivel extrair version-marker; fallback para health-only check."
            echo "marker=" >> $GITHUB_OUTPUT
          else
            echo "Expected version marker: $MARKER"
            echo "marker=$MARKER" >> $GITHUB_OUTPUT
          fi

      - name: Aguardar Railway subir nova versao (timeout 12min)
        run: |
          EXPECTED="${{ steps.marker.outputs.marker }}"
          VERSION_URL="https://agenda-backend-production-cc5e.up.railway.app/api/publico/version"
          # Sleep inicial: Railway demora ~30s pra trocar de container
          sleep 30
          for i in $(seq 1 70); do
            if [ -n "$EXPECTED" ]; then
              ACTUAL=$(curl --silent --max-time 10 "$VERSION_URL" | grep -oE '"marker":"[^"]+"' | sed 's/"marker":"\(.*\)"/\1/' || true)
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "Backend rodando versao esperada ($EXPECTED) apos ${i} tentativas."
                exit 0
              fi
              echo "Tentativa ${i}/70 — marker atual='${ACTUAL}' esperado='${EXPECTED}', aguardando 10s..."
            else
              if curl --fail --silent --max-time 10 -o /dev/null "${BACKEND_HEALTH_URL}"; then
                echo "Backend health OK apos ${i} tentativas (sem marker check)."
                exit 0
              fi
              echo "Tentativa ${i}/70 — health falhou, aguardando 10s..."
            fi
            sleep 10
          done
          echo "::error::Backend nao subiu versao esperada em 12 minutos."
          exit 1

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: wait-for-ci
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://agenda-backend-production-cc5e.up.railway.app/api

      - name: Deploy para Vercel (prebuilt)
        run: |
          cd frontend
          npx vercel deploy --prod \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope aleefhenriiques-projects \
            --yes \
            --prebuilt 2>&1 | tail -5

      - name: Smoke test frontend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 10 -o /dev/null "${VERCEL_FRONTEND_URL}"; then
              echo "Frontend OK após ${i} tentativas."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Frontend smoke test não confirmou 200 em 5min."
