name: Deploy (Railway + Vercel)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'O que redeployar'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

concurrency:
  group: deploy-railway-vercel
  cancel-in-progress: false

env:
  RAILWAY_ENV_ID: 1311cc26-ebee-4989-b49b-0e905b9950cc
  RAILWAY_BACKEND_SERVICE_ID: 172a055d-4c11-47c7-b62b-6c02aab1e320
  BACKEND_HEALTH_URL: https://agenda-backend-production-cc5e.up.railway.app/actuator/health
  VERCEL_FRONTEND_URL: https://agendainteligente-aleefhenriiques-projects.vercel.app

jobs:
  wait-for-ci:
    name: Aguardar CI passar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Backend (Spring Boot, Java 21)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Frontend (Vite + TypeScript)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  deploy-backend:
    name: Deploy backend (Railway)
    needs: wait-for-ci
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'backend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # IMPORTANTE: NÃO chamamos serviceInstanceDeploy aqui.
      # Railway está configurado para auto-build no push do GitHub. A mutation
      # serviceInstanceDeploy apenas REDEPLOYA a imagem existente (sem rebuild)
      # e pode interromper o auto-build em andamento, fixando o container na
      # versão anterior. Confiamos no auto-build do Railway e ficamos
      # polling /api/publico/version até bater com o marker do código.

      - name: Extrair marker esperado de application.yml
        id: marker
        run: |
          MARKER=$(grep -oP 'version-marker: \$\{APP_VERSION_MARKER:\K[^}]+' src/main/resources/application.yml || true)
          if [ -z "$MARKER" ]; then
            echo "::warning::Nao foi possivel extrair version-marker; fallback para health-only check."
            echo "marker=" >> $GITHUB_OUTPUT
          else
            echo "Expected version marker: $MARKER"
            echo "marker=$MARKER" >> $GITHUB_OUTPUT
          fi

      - name: Aguardar Railway subir nova versao (timeout 12min)
        run: |
          EXPECTED="${{ steps.marker.outputs.marker }}"
          VERSION_URL="https://agenda-backend-production-cc5e.up.railway.app/api/publico/version"
          # Sleep inicial: Railway demora ~30s pra trocar de container
          sleep 30
          for i in $(seq 1 70); do
            # Sempre verificar health primeiro
            HEALTH=$(curl --silent --max-time 10 -o /dev/null -w "%{http_code}" "${BACKEND_HEALTH_URL}" || echo "000")
            if [ "$HEALTH" != "200" ]; then
              echo "Tentativa ${i}/70 — health retornou ${HEALTH}, aguardando 10s..."
              sleep 10
              continue
            fi
            if [ -n "$EXPECTED" ]; then
              VERSION_RESP=$(curl --silent --max-time 10 "$VERSION_URL" || true)
              VERSION_HTTP=$(curl --silent --max-time 10 -o /dev/null -w "%{http_code}" "$VERSION_URL" || echo "000")
              ACTUAL=$(echo "$VERSION_RESP" | grep -oE '"marker":"[^"]+"' | sed 's/"marker":"\(.*\)"/\1/' || true)
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "Backend rodando versao esperada ($EXPECTED) apos ${i} tentativas."
                exit 0
              fi
              # Se o endpoint retorna 500 (bug conhecido no GlobalExceptionHandler),
              # confiar apenas no health check para evitar timeout desnecessario
              if [ "$VERSION_HTTP" = "500" ] && [ "$HEALTH" = "200" ]; then
                echo "::warning::Version endpoint retornou 500 mas health OK — aceitando deploy."
                exit 0
              fi
              echo "Tentativa ${i}/70 — marker='${ACTUAL}' esperado='${EXPECTED}' (HTTP ${VERSION_HTTP}), aguardando 10s..."
            else
              echo "Backend health OK apos ${i} tentativas (sem marker check)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend nao subiu versao esperada em 12 minutos."
          exit 1

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: wait-for-ci
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'frontend')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build e deploy Vercel
        # VERCEL_ORG_ID + VERCEL_PROJECT_ID são lidos pelo CLI automaticamente (sem --scope).
        # Sem --prebuilt: o CLI faz o build no próprio step (VITE_API_URL injetado via env do projeto).
        # frontend/.vercel/project.json aponta para prj_Q2DmmfaWMXVa0FRgV37GIJuHHOWF / team_4hLqFiFQMFA6f4nG2RdmAaqL.
        run: |
          cd frontend
          npx vercel deploy --prod \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --yes 2>&1 | tail -10
        env:
          VERCEL_ORG_ID: team_4hLqFiFQMFA6f4nG2RdmAaqL
          VERCEL_PROJECT_ID: prj_Q2DmmfaWMXVa0FRgV37GIJuHHOWF

      - name: Smoke test frontend
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 10 -o /dev/null "${VERCEL_FRONTEND_URL}"; then
              echo "Frontend OK após ${i} tentativas."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Frontend smoke test não confirmou 200 em 5min."
