name: Deploy (Easypanel)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'O que redeployar'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

# Aguarda o CI passar antes de disparar deploy
concurrency:
  group: deploy-easypanel
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Aguardar CI passar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Backend (Spring Boot, Java 21)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Frontend (Vite + TypeScript)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Mobile (Expo, type-check)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success,skipped,neutral

  docker-backend:
    name: Build + push imagem backend (GHCR)
    needs: wait-for-ci
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'backend')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Calcular tag da imagem (GHCR exige lowercase)
        id: image_tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${OWNER}/agendainteligente-backend:latest" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR (GitHub Actions tem acesso confiavel ao Maven Central)
        run: mvn -B -ntp -DskipTests verify

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push imagem runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend-runtime
          push: true
          tags: ${{ steps.image_tag.outputs.tag }}

  deploy-backend:
    name: Deploy backend (Easypanel)
    needs: [wait-for-ci, docker-backend]
    if: |
      always() &&
      needs.docker-backend.result == 'success' &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'backend')
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar source da service para imagem GHCR
        run: |
          IMAGE="${{ needs.docker-backend.outputs.image }}"
          curl --fail --silent --show-error \
            -X POST "http://31.97.162.185:3000/api/trpc/services.app.updateSourceImage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.EASYPANEL_API_TOKEN }}" \
            -d "{\"json\":{\"projectName\":\"agenda-inteligente\",\"serviceName\":\"agenda_backend\",\"image\":\"${IMAGE}\"}}"

      - name: Disparar deploy
        run: |
          curl --fail --silent --show-error \
            -X POST "http://31.97.162.185:3000/api/trpc/services.app.deployService" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.EASYPANEL_API_TOKEN }}" \
            -d '{"json":{"projectName":"agenda-inteligente","serviceName":"agenda_backend"}}'
          echo "Backend deploy disparado."

  deploy-frontend:
    name: Deploy frontend (Easypanel)
    needs: [wait-for-ci]
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'frontend')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Easypanel deploy (frontend)
        run: |
          curl --fail --silent --show-error \
            -X POST "${{ secrets.EASYPANEL_DEPLOY_FRONTEND_URL }}" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo "Frontend deploy disparado."
