name: Deploy (Easypanel)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'O que redeployar'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - backend
          - frontend

concurrency:
  group: deploy-easypanel
  cancel-in-progress: false

env:
  EASYPANEL_HOST: https://easypanel.agendainteligenteapp.cloud
  PROJECT_NAME: agenda-inteligente
  BACKEND_SERVICE: agenda_backend
  FRONTEND_SERVICE: agenda_frontend
  BACKEND_HEALTH_URL: https://agendainteligentebackend.agendainteligenteapp.cloud/actuator/health
  FRONTEND_URL: https://www.agendainteligenteapp.cloud/

jobs:
  # Aguarda os checks CRÍTICOS do CI. mobile-typecheck é condicional e não bloqueia deploy.
  wait-for-ci:
    name: Aguardar CI passar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Backend (Spring Boot, Java 21)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
      - uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'Frontend (Vite + TypeScript)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15

  docker-backend:
    name: Build + push imagem backend (GHCR)
    needs: wait-for-ci
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'backend')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Computar metadados da imagem
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_repo=ghcr.io/${OWNER}/agendainteligente-backend" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR (pula testes — já rodaram no CI)
        run: mvn -B -ntp -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push imagem (com cache de layers GHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend-runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.image_repo }}:latest
            ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}

  deploy-backend:
    name: Deploy backend (Easypanel) + health check
    needs: docker-backend
    if: |
      always() &&
      needs.docker-backend.result == 'success' &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'backend')
    runs-on: ubuntu-latest
    steps:
      - name: Apontar serviço para a imagem nova (tag SHA evita cache de :latest)
        run: |
          IMAGE="${{ needs.docker-backend.outputs.image_repo }}:${{ needs.docker-backend.outputs.image_tag }}"
          curl --fail --silent --show-error \
            -X POST "${EASYPANEL_HOST}/api/trpc/services.app.updateSourceImage" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.EASYPANEL_API_TOKEN }}" \
            -d "{\"json\":{\"projectName\":\"${PROJECT_NAME}\",\"serviceName\":\"${BACKEND_SERVICE}\",\"image\":\"${IMAGE}\",\"username\":\"${{ github.actor }}\",\"password\":\"${{ secrets.GITHUB_TOKEN }}\"}}"
          echo "Imagem apontada para: ${IMAGE}"

      - name: Disparar deploy
        run: |
          curl --fail --silent --show-error \
            -X POST "${EASYPANEL_HOST}/api/trpc/services.app.deployService" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.EASYPANEL_API_TOKEN }}" \
            -d "{\"json\":{\"projectName\":\"${PROJECT_NAME}\",\"serviceName\":\"${BACKEND_SERVICE}\"}}"
          echo "Deploy do backend disparado."

      - name: Aguardar /actuator/health (timeout 12min)
        run: |
          for i in $(seq 1 72); do
            if curl --fail --silent --max-time 10 -o /dev/null "${BACKEND_HEALTH_URL}"; then
              echo "Backend respondendo OK após ${i} tentativas."
              exit 0
            fi
            echo "Tentativa ${i}/72 — backend ainda não respondeu. Aguardando 10s..."
            sleep 10
          done
          echo "::error::Backend não passou no healthcheck em 12 minutos."
          exit 1

  deploy-frontend:
    name: Deploy frontend (Easypanel) + smoke test
    needs: wait-for-ci
    if: |
      always() &&
      (needs.wait-for-ci.result == 'success' || github.event_name == 'workflow_dispatch') &&
      (github.event_name == 'push' || github.event.inputs.target == 'both' || github.event.inputs.target == 'frontend')
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy (rebuild do Dockerfile no Easypanel)
        run: |
          curl --fail --silent --show-error \
            -X POST "${EASYPANEL_HOST}/api/trpc/services.app.deployService" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.EASYPANEL_API_TOKEN }}" \
            -d "{\"json\":{\"projectName\":\"${PROJECT_NAME}\",\"serviceName\":\"${FRONTEND_SERVICE}\"}}"
          echo "Deploy do frontend disparado."

      - name: Aguardar landing responder 200 (timeout 10min)
        run: |
          for i in $(seq 1 60); do
            if curl --fail --silent --max-time 10 -o /dev/null "${FRONTEND_URL}"; then
              echo "Frontend respondendo OK após ${i} tentativas."
              exit 0
            fi
            echo "Tentativa ${i}/60 — frontend ainda não respondeu. Aguardando 10s..."
            sleep 10
          done
          echo "::error::Frontend não respondeu 200 em 10 minutos."
          exit 1
